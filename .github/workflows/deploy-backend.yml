name: Deploy backend to Dell

on:
  push:
    branches: [main]
    paths:
      - "almacen-de-bolsillo/backend/**"
      - "almacen-de-bolsillo/packages/**"
      - "almacen-de-bolsillo/Dockerfile"
      - "almacen-de-bolsillo/compose.production.yaml"
      - "almacen-de-bolsillo/pnpm-lock.yaml"
      - "almacen-de-bolsillo/pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DELL_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend on Dell
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ProxyCommand="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p 5460 mariano@149.34.226.5 -W %h:%p" \
            mabelo-inspiron5481@10.77.0.2 \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/apps/almacen-de-bolsillo

          GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main

          cd almacen-de-bolsillo


          docker compose \
            -f compose.production.yaml \
            -f ../compose.dell.yaml \
            build backend

          docker compose \
            -f compose.production.yaml \
            -f ../compose.dell.yaml \
            --profile tools \
            run --rm migrate

          docker compose \
            -f compose.production.yaml \
            -f ../compose.dell.yaml \
            up -d --no-deps backend

          curl --fail --silent \
            http://10.77.0.2:3103/health
          for i in $(seq 1 20); do
            if curl --fail --silent \
              http://10.77.0.2:3103/health > /dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 3
          done

          echo "Backend healthcheck failed"
          exit 1
          REMOTE



